name: sync-ports

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize discovery and deployment, including ordinary website pushes.
concurrency:
  group: landing-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'living-code-theme/landing' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
        working-directory: landing
    steps:
      - name: Check out the latest production website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: landing
          # The write token is not left in .git/config for install/build; only the push step authenticates.
          persist-credentials: false

      - name: Check out reviewed discovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: living-code-theme/core
          # Reviewed schema-2/R2 publication, optional previews for image-free READMEs and symbol port emoji.
          ref: ee6b2324148015d5c4e0c3de683b3eb658e23f46
          path: core
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.0
          run_install: false

      - name: Install discovery tooling
        working-directory: core
        run: pnpm install --frozen-lockfile

      - name: Discover and validate public port repositories
        working-directory: core
        env:
          GH_TOKEN: ${{ github.token }}
          PORT_ASSET_STORAGE: ${{ vars.PORT_ASSET_STORAGE || 'git' }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || secrets.R2_PUBLIC_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          case "$PORT_ASSET_STORAGE" in
            git) pnpm sync:ports --landing "$GITHUB_WORKSPACE/landing" ;;
            r2) pnpm sync:ports --landing "$GITHUB_WORKSPACE/landing" --r2 ;;
            *) echo '::error::PORT_ASSET_STORAGE must be git or r2'; exit 1 ;;
          esac

      # Derivatives belong to the website. This explicit refresh may download pinned public captures;
      # ordinary builds below stay offline, and unchanged derivatives are reused without downloads.
      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare responsive screenshot variants
        run: pnpm images:prepare

      - name: Decide whether to publish
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- data/ports.json data/ports public/port-images data/image-variants.json public/image-variants
          changed=false
          if ! git diff --cached --quiet; then changed=true; fi
          # A failed deployment must be retried even when discovery is now unchanged.
          last_successful_head="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sync-ports.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          publish=false
          if [[ "$changed" == true || "$GITHUB_EVENT_NAME" == workflow_dispatch || "$(git rev-parse HEAD)" != "$last_successful_head" ]]; then
            publish=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          printf 'Port snapshot changed: **%s**\n\nPublish required: **%s**\n' "$changed" "$publish" >> "$GITHUB_STEP_SUMMARY"

      - name: Check Cloudflare configuration
        if: steps.changes.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable or secret}"

      - name: Build the website
        if: steps.changes.outputs.publish == 'true'
        run: pnpm build

      - name: Test the built website
        if: steps.changes.outputs.publish == 'true'
        run: pnpm test

      - name: Test browser loading and security policies
        if: steps.changes.outputs.publish == 'true'
        run: pnpm test:browser

      - name: Commit only validated snapshots and captures
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync port documentation and screenshots'
          # Fail rather than merging a newer, untested production checkout.
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:main

      - name: Reject an outdated production checkout
        id: current
        if: steps.changes.outputs.publish == 'true'
        run: |
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$(git rev-parse HEAD)" != "$remote_head" ]]; then
            echo '::error::Production advanced during validation. Rerun against the latest main.'
            exit 1
          fi

      # GITHUB_TOKEN commits do not trigger another Actions run. Deploy the tested dist/ here.
      - name: Deploy validated assets to Cloudflare Workers
        if: steps.changes.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
